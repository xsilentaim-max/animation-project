<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbiting Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <section class="card">
        <div class="card__header">
          <h1>Orbiting Dots</h1>
          <p>Pure HTML + CSS animation with layered motion.</p>
        </div>
        <div class="orbit" aria-hidden="true">
          <div class="orbit__ring"></div>
          <div class="orbit__dot orbit__dot--primary"></div>
          <div class="orbit__dot orbit__dot--secondary"></div>
          <div class="orbit__dot orbit__dot--accent"></div>
          <div class="orbit__core"></div>
        </div>
        <div class="card__footer">
          <span class="pulse"></span>
          <p>Animating with keyframes, gradients, and transforms.</p>
        </div>
      </section>
    </main>
  </body>
</html>
